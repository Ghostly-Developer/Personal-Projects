<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            font-weight: bold;
        }
        input[type="url"], input[type="datetime-local"] {
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>URL Shortener</h1>
        <form id="shortenForm">
            <label for="url">Original URL:</label>
            <input type="url" id="url" name="url" required placeholder="https://example.com">

            <label for="expiry">Expiry Date (optional):</label>
            <input type="datetime-local" id="expiry" name="expiry">

            <button type="submit">Shorten URL</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('shortenForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const url = document.getElementById('url').value;
            const expiry = document.getElementById('expiry').value;
            const resultDiv = document.getElementById('result');

            // Clear previous result
            resultDiv.style.display = 'none';
            resultDiv.className = '';
            resultDiv.textContent = '';

            try {
                const body = { url };
                if (expiry) {
                    // Convert to ISO string
                    const expiryDate = new Date(expiry);
                    body.expiry = expiryDate.toISOString();
                }

                const response = await fetch('/shorten', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body),
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `Short URL: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = data.error || 'An error occurred';
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = 'Failed to shorten URL. Please try again.';
            }

            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
